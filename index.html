<!-- 1. 매 페이지 상단 동기부여 인용구 바 -->
<div class="motivation-banner">
  <div class="motivation-quote">
    "목적 없는 삶은 항해사 없는 배와 같다." 
    <span class="motivation-author">- 토마스 칼라일</span>
  </div>
</div>

<!-- 2. Bridge (목표 구체화 Step) 페이지 -->
<div class="bridge-container">
  <div class="bridge-book-spine"></div>
  <div class="bridge-header">
    <h2 class="bridge-title">제 2장: 목표의 정립</h2>
    <p class="bridge-subtitle">세부 페이지로 이동하기 전, 목표를 점검하는 단원입니다.</p>
  </div>

  <!-- 목표 미정 사용자를 위한 Nudge Step -->
  <div class="nudge-step-wizard">
    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>
    <div class="nudge-question">
      💡 이번 달에 완성하고 싶은 삶의 한 단락은 무엇인가요?
    </div>
    <div class="nudge-input-group">
      <input type="text" class="nudge-input" placeholder="예: 매일 30분씩 독서하고 회고록 작성하기">
    </div>
    <div class="nudge-actions">
      <button class="btn-secondary">건너뛰기</button>
      <button class="btn-primary">다음 단계로 →</button>
    </div>
  </div>
</div>

<!-- 3. 메인 MBO 페이지 진함/연함 잔디 그리드 -->
<div class="mbo-grid-board">
  <!-- data-level 0~4에 따라 색상 농도가 자동 변경됩니다 -->
  <div class="mbo-grid-cell" data-level="0" title="달성률 0%"></div>
  <div class="mbo-grid-cell" data-level="1" title="달성률 25%"></div>
  <div class="mbo-grid-cell" data-level="2" title="달성률 50%"></div>
  <div class="mbo-grid-cell" data-level="3" title="달성률 75%"></div>
  <div class="mbo-grid-cell" data-level="4" title="달성률 100%"></div>
</div>

<!-- 4. 독서회고 및 생활 종합 정리 (펼침북 스타일) -->
<div class="retrospective-spread">
  <div class="retro-page-left">
    <h3 class="retro-section-title">📖 지난 생활 기록 요약</h3>
    <div class="retro-summary-card">
      이번 달에는 총 12개의 MBO 세부 과제 중 9개를 완수했습니다. 특히 독서 및 기록 습관 부문에서 높은 달성률을 보였습니다.
    </div>
  </div>
  <div class="retro-page-right">
    <h3 class="retro-section-title">✒️ 총평 및 성찰</h3>
    <div class="retro-summary-card">
      목표를 잘게 나누어 진행한 덕분에 꾸준함을 유지할 수 있었습니다. 다음 단원에서는 시간 배분을 조금 더 세분화해보세요.
    </div>
  </div>
</div>
